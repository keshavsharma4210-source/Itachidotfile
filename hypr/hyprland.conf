# ==========================================
# ITACHI HYPRLAND
# Main Hyprland Configuration
# ==========================================

# ---------- MONITOR ----------

monitor=,preferred,auto,1


# ---------- ENVIRONMENT ----------

env = XCURSOR_SIZE,24
env = HYPRCURSOR_SIZE,24


# ---------- GENERAL ----------

general {
    gaps_in = 5
    gaps_out = 12

    border_size = 2

    layout = dwindle

    allow_tearing = false
}


# ---------- DECORATION ----------

decoration {
    rounding = 8

    active_opacity = 0.95
    inactive_opacity = 0.85

    shadow {
        enabled = true
        range = 12
        render_power = 3
    }

    blur {
        enabled = true
        size = 5
        passes = 2
    }
}


# ---------- ANIMATIONS ----------

animations {
    enabled = true

    animation = windows, 1, 5, default
    animation = windowsOut, 1, 5, default
    animation = border, 1, 5, default
    animation = fade, 1, 5, default
    animation = workspaces, 1, 5, default
}


# ---------- INPUT ----------

input {
    kb_layout = us

    follow_mouse = 1

    sensitivity = 0
}


# ---------- LAYOUT ----------

dwindle {
    pseudotile = true
    preserve_split = true
}


# ---------- ITACHI COLOURS ----------

general {
    col.active_border = rgba(8f0000ee) rgba(ff1a1aff) 45deg
    col.inactive_border = rgba(241414aa)
}
# ---------- KEYBINDS ----------

source = ~/.config/hypr/keybinds.conf